---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nvidia-replica-scaler-webui
  namespace: gpu
spec:
  interval: 10m
  chart:
    spec:
      chart: app-template
      version: 4.0.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system

  values:
    defaultPodOptions:
      automountServiceAccountToken: true

    serviceAccount:
      nvidia-replica-scaler-webui:
        enabled: true
        annotations: {}

    rbac:
      roles:
        nvidia-replica-scaler-webui:
          enabled: true
          type: ClusterRole
          rules:
            - apiGroups: ["apps"]
              resources: ["deployments", "deployments/status", "deployments/scale", "statefulsets", "statefulsets/status", "statefulsets/scale"]
              verbs: ["get", "list", "patch", "update"]
            - apiGroups: [""]
              resources: ["configmaps"]
              verbs: ["get", "list", "create", "update", "patch"]
            - apiGroups: [""]
              resources: ["pods"]
              verbs: ["get", "list"]
            - apiGroups: [""]
              resources: ["persistentvolumeclaims"]
              verbs: ["get", "list"]
      bindings:
        nvidia-replica-scaler-webui:
          enabled: true
          type: ClusterRoleBinding
          roleRef:
            identifier: nvidia-replica-scaler-webui
          subjects:
            - identifier: nvidia-replica-scaler-webui

    controllers:
      nvidia-replica-scaler-webui:
        containers:
          app:
            image:
              repository: ghcr.io/niki-on-github/nvidia-replica-scaler-webui
              tag: "v0.1.0"
            env:
              # Comma-separated namespaces to scan (empty = all namespaces)
              NAMESPACES: "gpu"
              # RuntimeClassName used by the GPU heuristic
              GPU_RUNTIME_CLASS: "nvidia"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8080
                  initialDelaySeconds: 5
                  periodSeconds: 30

    service:
      webui:
        controller: nvidia-replica-scaler-webui
        ports:
          http:
            port: 8080

    ingress:
      webui:
        className: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
        hosts:
          - host: &ingress "nvidia-replica-scaler-webui.${SECRET_DOMAIN}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: webui
                  port: http
        tls:
          - hosts:
              - *ingress
